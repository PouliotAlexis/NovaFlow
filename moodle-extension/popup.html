<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            width: 280px;
            padding: 16px;
            padding-bottom: 8px;
            margin: 0;
            background-color: #121212;
            color: #ffffff;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #f98012;
        }

        .status {
            padding: 10px;
            border-radius: 6px;
            background: #1e1e1e;
            margin-bottom: 12px;
            font-size: 13px;
        }

        .status-success {
            border-left: 4px solid #22c55e;
        }

        .status-failed {
            border-left: 4px solid #ef4444;
        }

        .status-pending {
            border-left: 4px solid #f59e0b;
        }

        .row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .label {
            color: #a1a1aa;
        }

        button {
            width: 100%;
            padding: 8px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            margin-top: 8px;
        }

        button:hover {
            background-color: #2563eb;
        }

        .btn-secondary {
            background-color: #3f3f46;
            margin-top: 12px;
            font-size: 12px;
        }

        .btn-secondary:hover {
            background-color: #52525b;
        }

        .footer {
            margin-top: 16px;
            font-size: 10px;
            text-align: center;
            color: #71717a;
        }
    </style>
</head>

<body>
    <h2>🎓 NovaFlow Moodle Sync</h2>

    <div id="statusBox" class="status status-pending">
        <div class="row">
            <span class="label">Date sync :</span>
            <span id="syncDate">---</span>
        </div>
        <div class="row">
            <span class="label">Événements :</span>
            <span id="syncCount">0</span>
        </div>
        <div class="row">
            <span class="label">Fichiers :</span>
            <span id="fileCount">0</span>
        </div>
        <div class="row">
            <span class="label">État :</span>
            <span id="syncState">En attente...</span>
        </div>
    </div>

    <button id="btnRetry">Lancer un tracking Moodle maintenant</button>
    <p class="footer">Ouvre une page Moodle pour synchroniser tes événements et récupérer tes fichiers de cours.</p>

    <script src="popup.js"></script>
</body>

</html>
